[project]
name = "rageva"
version = "0.1.0"
description = "Local RAG evaluation workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "huey>=3.4,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "scripts/export_openapi.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
